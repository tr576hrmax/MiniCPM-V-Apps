name: Build MiniCPM-V Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android dependencies
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Build APK
        working-directory: MiniCPM-V-demo-Android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniCPM-V-Android-APK
          path: MiniCPM-V-demo-Android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
